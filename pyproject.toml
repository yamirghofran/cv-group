[project]
name = "cv-group"
version = "0.1.0"
description = "Basketball computer vision pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.110",
    "numpy>=1.26",
    "opencv-python>=4.9,<4.13",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "requests>=2.31",
    "scipy>=1.11",
    "supervision>=0.20",
    "torch>=2.1",
    "torchvision>=0.20.1",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pillow>=10.0",
    "transformers>=4.45",
    "peft>=0.12",
    "roboflow>=1.1",
    "inference>=1.2.7",
    "ultralytics>=8.3",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
clustering = [
    "scikit-learn>=1.4",
    "transformers>=4.45",
    "umap-learn>=0.5",
]
train = [
    "roboflow>=1.1",
]
sam2 = [
    "SAM-2",
]

[tool.uv.sources]
SAM-2 = { git = "https://github.com/facebookresearch/sam2.git" }

[project.scripts]
basketball-detect = "src.detection:main"
basketball-track = "src.tracking:main"
basketball-visualize-detections = "src.visualize_detections:main"
basketball-visualize-tracks = "src.visualize_tracks:main"
basketball-export-crops = "src.export_crops:main"
basketball-train-resnet = "jersey_numbers.ocr.resnet:main"
basketball-train-smolvlm2 = "scripts.train_smolvlm2:main"
basketball-train-resnet18 = "jersey_numbers.ocr.resnet18:main"
basketball-match-numbers = "jersey_numbers.matching.ios:main"
basketball-eval-resnet = "evaluation.eval_resnet:main"
basketball-eval-resnet18 = "evaluation.eval_resnet18:main"
basketball-eval-matching = "evaluation.eval_matching:main"
basketball-eval-smolvlm2 = "evaluation.eval_smolvlm2:main"
basketball-team-cluster = "clustering.cli:cluster_main"
basketball-team-bench = "clustering.cli:bench_main"
basketball-api = "api.app:run"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["object-detection", "numbers", "."]
include = ["src*", "jersey_numbers*", "evaluation*", "scripts*", "clustering*", "api*"]
exclude = ["object-detection*", "third_party*", "tests*", "docs*", "data*", "outputs*", "checkpoints*"]

[tool.pytest.ini_options]
testpaths = ["object-detection/tests", "numbers/tests", "clustering/tests"]
pythonpath = ["object-detection", "numbers", "."]
