detector:
  backend: "yolo"  # roboflow | yolo

roboflow:
  api_url: "https://detect.roboflow.com"
  model_id: "basketball-player-detection-3-ycjdo"
  model_version: 13
  confidence: 40
  overlap: 30
  timeout_seconds: 60

yolo:
  weights_path: "object-detection/finetuning/runs/basketball_yolo11s/weights/best.pt"
  imgsz: 640
  conf: 0.25
  iou: 0.5
  device: null  # null -> ultralytics auto (cuda > mps > cpu)

detection:
  frame_stride: 5
  player_like_classes:
    - player
    - player-in-possession
    - player-jump-shot
    - player-layup-dunk
    - player-shot-block
    - player-layup
    - player-dribble
    - player-screen
    - player-fall
  relevant_classes:
    - ball
    - ball-in-basket
    - ball_vis_full
    - ball_vis_partial
    - ball_vis_visible
    - number
    - player
    - player-in-possession
    - player-jump-shot
    - player-layup-dunk
    - player-shot-block
    - referee
    - rim

tracking:
  backend: "sam2"
  sam2_checkpoint: "object-detection/checkpoints/sam2.1_hiera_large.pt"
  sam2_model_cfg: "configs/sam2.1/sam2.1_hiera_l.yaml"
  device: "auto"

mask_cleanup:
  distance_threshold: 80
  min_component_area: 50

handoff:
  crop_fps: 1.0

court_keypoints:
  backend: "roboflow"
  api_url: "https://serverless.roboflow.com"
  model_id: "basketball-court-detection-2"
  model_version: 19
  confidence: 30
  overlap: 30
  yolo_weights: "object-detection/models/court_yolo11m_pose_v19/best.pt"
  yolo_confidence: 0.25
  yolo_device: "auto"
  keypoint_confidence: 0.5
  frame_stride: 15
  min_keypoints: 4
  class_id_offset: 0

ball_tracking:
  frame_stride: 1
  min_confidence: 0.25
  max_missing_gap: 6
  max_jump_px: 450
  prediction_gate_px: 300
  smoothing_window: 3

court_projection:
  court_length_ft: 94.0
  court_width_ft: 50.0
  out_of_bounds_margin_ft: 5.0
  smoothing_window: 5
  ball_smoothing_window: 3
  max_player_jump_ft: 12.0
  max_ball_jump_ft: 35.0
  max_reused_player_frames: 10
  ball_player_snap_distance_px: 90.0
  ball_max_player_distance_ft: 20.0
  ball_max_rim_distance_ft: 15.0

court_visualization:
  panel_height: 720
  trail_length: 45
