detector:
  backend: "yolo"  # roboflow | yolo

roboflow:
  api_url: "https://detect.roboflow.com"
  model_id: "basketball-player-detection-3-ycjdo"
  model_version: 13
  confidence: 40
  overlap: 30
  timeout_seconds: 60

yolo:
  weights_path: "object-detection/finetuning/runs/basketball_yolo11s/weights/best.pt"
  imgsz: 640
  conf: 0.25
  iou: 0.5
  device: null  # null -> ultralytics auto (cuda > mps > cpu)

detection:
  frame_stride: 5
  player_like_classes:
    - player
    - player-in-possession
    - player-jump-shot
    - player-layup-dunk
    - player-shot-block
    - player-layup
    - player-dribble
    - player-screen
    - player-fall
  relevant_classes:
    - ball
    - ball-in-basket
    - ball_vis_full
    - ball_vis_partial
    - ball_vis_visible
    - number
    - player
    - player-in-possession
    - player-jump-shot
    - player-layup-dunk
    - player-shot-block
    - referee
    - rim

tracking:
  backend: "sam2"
  sam2_checkpoint: "object-detection/checkpoints/sam2.1_hiera_large.pt"
  sam2_model_cfg: "configs/sam2.1/sam2.1_hiera_l.yaml"
  device: "auto"

mask_cleanup:
  distance_threshold: 80
  min_component_area: 50

handoff:
  crop_fps: 1.0
